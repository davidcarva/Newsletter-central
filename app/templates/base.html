<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Newsletter Central{% endblock %}</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#262a33; --text:#e6e7eb; --mut:#9aa0ad; --acc:#6ea8fe; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; gap:24px; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  header nav a { color:var(--mut); text-decoration:none; margin-right:16px; font-size:14px; }
  header nav a:hover { color:var(--text); }
  main { max-width:1100px; margin:0 auto; padding:24px; display:grid; grid-template-columns:240px 1fr; gap:24px; }
  aside { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; height:fit-content; }
  aside h3 { font-size:12px; text-transform:uppercase; color:var(--mut); margin:0 0 12px; letter-spacing:.5px; }
  aside ul { list-style:none; padding:0; margin:0; }
  aside li { margin-bottom:8px; }
  aside a { color:var(--text); text-decoration:none; font-size:14px; }
  aside a:hover { color:var(--acc); }
  section.content { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:24px; }
  .bloco { margin-bottom:32px; }
  .bloco h2 { font-size:20px; margin:0 0 12px; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .item { padding:12px 0; border-bottom:1px dashed var(--line); }
  .item:last-child { border-bottom:none; }
  .item h4 { margin:0 0 4px; font-size:16px; }
  .item h4 a { color:var(--text); text-decoration:none; }
  .item h4 a:hover { color:var(--acc); }
  .item p { margin:4px 0; color:#cdd1da; font-size:14px; line-height:1.5; }
  .item .meta { font-size:12px; color:var(--mut); }
  .btn { background:var(--acc); color:#0f1115; border:none; padding:8px 14px; border-radius:6px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; font-size:14px; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  .btn.danger { background:#c75450; color:white; }
  form.inline { display:inline; }
  input[type=text] { background:#0f1115; border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:6px; font-size:14px; }
  .tema-card { background:#0f1115; border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  .tema-card header { background:transparent; border:none; padding:0 0 8px; display:flex; justify-content:space-between; align-items:center; }
  .tema-card header h3 { font-size:16px; margin:0; color:var(--text); text-transform:none; letter-spacing:0; }
  .feed-row { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; color:var(--mut); }
  .feed-row code { font-size:12px; color:#bcc1cc; word-break:break-all; }
  .empty { color:var(--mut); font-style:italic; padding:12px 0; }

  /* Cores por item — borda lateral + leve tint */
  .item { border-left:4px solid transparent; padding-left:12px; transition:background .15s; }
  .item.cor-vermelho  { border-left-color:#e25c5c; background:rgba(226,92,92,.06); }
  .item.cor-laranja   { border-left-color:#e89c4d; background:rgba(232,156,77,.06); }
  .item.cor-amarelo   { border-left-color:#e8d04d; background:rgba(232,208,77,.06); }
  .item.cor-verde     { border-left-color:#5cc97a; background:rgba(92,201,122,.06); }
  .item.cor-azul      { border-left-color:#6ea8fe; background:rgba(110,168,254,.06); }
  .item.cor-roxo      { border-left-color:#b06efe; background:rgba(176,110,254,.06); }

  .item-acoes { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .swatches { display:inline-flex; gap:4px; }
  .swatch { width:18px; height:18px; border-radius:50%; border:1px solid var(--line); cursor:pointer; padding:0; }
  .swatch.sel { outline:2px solid var(--text); outline-offset:1px; }
  .swatch.s-vermelho  { background:#e25c5c; }
  .swatch.s-laranja   { background:#e89c4d; }
  .swatch.s-amarelo   { background:#e8d04d; }
  .swatch.s-verde     { background:#5cc97a; }
  .swatch.s-azul      { background:#6ea8fe; }
  .swatch.s-roxo      { background:#b06efe; }
  .swatch.s-nenhum    { background:transparent; }
  .btn-mini { background:transparent; color:var(--mut); border:1px solid var(--line); padding:4px 10px; border-radius:6px; font-size:12px; cursor:pointer; text-decoration:none; }
  .btn-mini:hover { color:var(--text); border-color:var(--text); }

  /* Página do roteiro */
  .roteiro-box { background:#0f1115; border:1px solid var(--line); border-radius:8px; padding:20px; white-space:pre-wrap; font-family:"Segoe UI",system-ui,sans-serif; font-size:15px; line-height:1.7; }
  .roteiro-box strong { color:#ffd166; }

  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
  .badge.tipo-livre   { background:rgba(110,168,254,.18); color:#9cc4ff; }
  .badge.tipo-noticia { background:rgba(92,201,122,.18); color:#7cd99a; }
  .badge.usado        { background:rgba(232,208,77,.2); color:#ffd76b; }
  .badge.usado.off    { background:transparent; color:var(--mut); border:1px solid var(--line); }

  .filtros { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .chip { padding:6px 12px; border:1px solid var(--line); border-radius:14px; font-size:13px; color:var(--mut); text-decoration:none; }
  .chip.ativo { background:var(--acc); color:#0f1115; border-color:var(--acc); font-weight:600; }
  .chip:hover { color:var(--text); }
</style>
</head>
<body>
<header>
  <h1>📰 Newsletter Central</h1>
  <nav>
    <a href="/">Edição</a>
    <a href="/biblioteca">📚 Biblioteca</a>
    <a href="/roteiros-livres">🎬 Novo roteiro</a>
    <a href="/temas">Temas & fontes</a>
    <a href="/config">⚙️ Estilo</a>
  </nav>
  <form action="/gerar-agora" method="post" class="inline" style="margin-left:auto">
    <button class="btn" type="submit">Gerar agora</button>
  </form>
</header>
<main>
  {% block body %}{% endblock %}
</main>
</body>
</html>
